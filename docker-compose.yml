# Одна команда: UI на :80 (nginx) + API на :3001
#   docker compose up --build
#
# Разработка: только API, фронт через Vite на :5173
#   docker compose up backend --build
#   cd frontend && npm run dev

services:
  backend:
    build: ./backend
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped
